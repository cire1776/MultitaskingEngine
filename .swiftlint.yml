# Root-level SwiftLint configuration for ULang

# Rules disabled globally
disabled_rules:
  - line_length  # You can re-enable this if needed later

# Rules customized globally
type_name:
  allowed_symbols: "_"   # Allow underscores in type names

force_cast:
  severity: error        # Fail on force casts in production code

# Exclude common autogenerated or irrelevant folders
excluded:
  - Carthage
  - Pods
  - fastlane
  - build
  - .build

# This ensures all rules apply by default
opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
